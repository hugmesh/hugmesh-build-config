# Manually-triggered release workflow for the hugmesh-build-config resource-only
# jar. Intentionally workflow_dispatch-only (no push/tag trigger) so it stays
# inert until a human turns it on. Mirrors what .gitlab-ci.yml already does
# (mvn package, then mvn deploy), retargeted from the GitLab Maven Package
# Registry to GitHub Packages. Auth uses actions/setup-java's built-in
# server-id/server-username/server-password mechanism — no hand-rolled
# settings.xml.
#
# LINK 1 OF 4, and the only link that needs NO -s settings file. The chain is
#   hugmesh-build-config 0.5.0 -> hugmesh-parent 2.8.0 -> hugmesh-commons 2.1.0
#     -> hugmesh-auth-core 2.5.1
# and this artifact is first precisely because it is the one with no net.hugmesh
# upstream: pom.xml declares no <parent> and no <dependencies> at all, so Maven
# Central is a sufficient repository list for it. The other three each ship a
# .github/maven-ci-settings.xml declaring the GitHub Packages URLs of the links
# before them; adding one here would be decoration, and decoration in a release
# path is a thing future readers trust.
#
# hugmesh-auth-core/.github/workflows/release-chain.yml fires all four in order
# from a single trigger. See RELEASING.md here, and hugmesh-auth-core/RELEASING.md
# sections 3.2 and 6 (operator decision 27, hugmesh-generator#347, 2026-09-17).

name: Release

on:
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN

      - name: Build the resource-only jar
        run: mvn -B -ntp package

      - name: Publish to GitHub Packages
        run: mvn -B -ntp deploy -DaltDeploymentRepository=github::default::https://maven.pkg.github.com/hugmesh/hugmesh-build-config
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
